[package]
name = "z-ai-spend-auditor"
version = "0.1.5"
edition = "2021"
description = "TEE spend auditor for AI API usage: append-only usage ledger, monthly aggregation, budget alerts, SHA-256 audit receipts — tenant-base world only (kv-store, logging, tenant-context; zero outbound HTTP)."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
